name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    uses: Rizz404/platform-workflows/.github/workflows/ci-go.yaml@61e630334eaf1e4c22c6f70e0866145cccf789b3 # v0.1.0
    with:
      working-directory: backend
      go-version: "1.27.3"

  frontend:
    name: Frontend
    uses: Rizz404/platform-workflows/.github/workflows/ci-node.yaml@61e630334eaf1e4c22c6f70e0866145cccf789b3 # v0.1.0
    with:
      working-directory: frontend
      node-version: "26.13.1"
      run-lint: true
      run-tests: false
