root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server.exe ./cmd/server"
entrypoint = ["./tmp/server.exe"]
include_ext = ["go"]
exclude_dir = ["tmp", "data", "frontend"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = false

[misc]
clean_on_exit = true
