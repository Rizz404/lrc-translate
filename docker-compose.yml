# Production stack for deploying via Plesk's Docker extension (Docker >
# Stacks) or plain `docker compose up -d --build` over SSH.
#
# Services:
#   - app: single container serving both the API and the built frontend
#     (see ../Dockerfile). Publishes one port — point your Plesk domain's
#     proxy/reverse-proxy rule at 127.0.0.1:${APP_PORT:-8080}.
#   - libretranslate: self-hosted MT engine so translate doesn't depend on
#     libretranslate.com's paid API key (see README.md). First start
#     downloads language models — can take a while and several GB of disk.
#     KISS priority (2026-08-26): the app service auto-prefers Gemini over
#     this service whenever GEMINI_API_KEY is set (TRANSLATE_PROVIDER left
#     unset below) — this service is only actually used as the MT backend
#     when no Gemini key is configured, or TRANSLATE_PROVIDER is forced to
#     "libretranslate" explicitly. See the app service's environment below.
#
# Usage:
#   cp .env.example .env   # adjust APP_PORT / secrets if needed
#   docker compose up -d --build
#
# Data persistence: the SQLite DB lives in the `app-data` named volume
# (/app/data/db.sqlite) and survives container recreation/image rebuilds —
# only `docker compose down -v` (or deleting the volume) wipes it.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Without this, Portainer's "Pull and redeploy" (or a plain `docker
    # compose up -d` on standalone Docker) reuses the cached image instead
    # of rebuilding from the freshly-pulled repo — so code updates would
    # silently not take effect.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_DRIVER: sqlite
      DB_DSN: /app/data/db.sqlite
      LRCLIB_BASE_URL: https://lrclib.net/api
      # Internal Docker network hostname of the libretranslate service below
      # — not a public URL, so no API key is needed.
      LIBRETRANSLATE_URL: http://libretranslate:5000
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      # KISS priority (2026-08-26): left unset (default), the backend
      # auto-prefers "gemini" (Google AI Studio — LLM-based, much more
      # natural/lyric-like output) whenever GEMINI_API_KEY below is filled
      # in, falling back to "libretranslate" (free, self-hosted, but fairly
      # literal output) otherwise. Set TRANSLATE_PROVIDER explicitly in your
      # Portainer stack's environment variables to force one regardless of
      # key presence. GEMINI_API_KEY is a secret and shouldn't be committed
      # to git.
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Frontend is served same-origin by this same container, so CORS
      # doesn't come into play for normal use; kept for completeness/direct
      # API access from another origin if you ever need it.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
    volumes:
      - app-data:/app/data
    depends_on:
      - libretranslate

  libretranslate:
    # Fully qualified on purpose: some setups (e.g. Podman on Fedora, whose
    # default unqualified-search-registries tries registry.fedoraproject.org
    # before docker.io) resolve a bare "libretranslate/libretranslate" to the
    # wrong registry and fail with "manifest unknown".
    image: docker.io/libretranslate/libretranslate
    restart: unless-stopped
    # The named volume below is created fresh by Docker with root:root
    # ownership, but the image runs as a non-root "libretranslate" user by
    # default — so without this it crash-loops forever on startup with
    # `PermissionError: [Errno 13] Permission denied:
    # '/home/libretranslate/.local/share/argos-translate'`. Only affects
    # this internal service (not published to the host), so running it as
    # root here is low-risk.
    user: root
    # Not published to the host on purpose — only `app` needs to reach it,
    # over the internal Docker network as http://libretranslate:5000.
    # Uncomment to also expose it on the host (e.g. for debugging):
    # ports:
    #   - "5000:5000"
    volumes:
      - libretranslate-data:/home/libretranslate/.local/share
    # Restricts which language models get loaded — also works around a
    # LibreTranslate bug where an EMPTY LT_LOAD_ONLY (rather than truly
    # unset) crashes it on every boot: `"".split(",")` gives `['']`, which
    # matches zero of the ~100 downloaded models, so `languages` ends up
    # empty and `languages[0]` throws IndexError. So this must never
    # resolve to an empty string — adjust the codes to whatever
    # source/target languages you actually translate between (LibreTranslate
    # often needs "en" too, as a pivot for pairs without a direct model).
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-ja,en,id}
      # LibreTranslate's own worker thread count (default 4 if unset). Keep
      # this matched to maxConcurrentTranslations (see translate_handler.go)
      # — both were dialed down from 8 to 3 after real-world testing on this
      # shared VPS showed 8-way concurrency causing CPU contention: requests
      # got slower under load, blew past the client timeout, and retried,
      # making things worse instead of faster. Raise both together only if
      # you've confirmed the host has the CPU headroom for it.
      LT_THREADS: ${LT_THREADS:-3}

volumes:
  app-data:
  libretranslate-data:
